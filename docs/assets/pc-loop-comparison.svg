<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-label="446在35块后对齐；七次四行PC在70块后对齐"><title>446在35块后对齐；七次四行PC在70块后对齐</title><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1000" height="530" rx="0" fill="#f6fafc" stroke="none"/><text x="30" y="40" font-size="25" font-weight="700" fill="#183044">两种方法都在做：空场 → 拼图与消行 → 再次空场</text><text x="30" y="91" font-size="24" font-weight="700" fill="#183044">446：三次PC</text><rect x="35" y="111" width="280" height="83" rx="10" fill="#d9f1ed" stroke="none"/><text x="60" y="145" font-size="25" font-weight="700" fill="#183044">4行PC</text><text x="60" y="177" font-size="18" font-weight="400" fill="#183044">10块 → 棋盘清空</text><text x="324" y="164" font-size="24" font-weight="700" fill="#183044">→</text><rect x="355" y="111" width="280" height="83" rx="10" fill="#d9f1ed" stroke="none"/><text x="380" y="145" font-size="25" font-weight="700" fill="#183044">4行PC</text><text x="380" y="177" font-size="18" font-weight="400" fill="#183044">10块 → 棋盘清空</text><text x="644" y="164" font-size="24" font-weight="700" fill="#183044">→</text><rect x="675" y="111" width="280" height="83" rx="10" fill="#fff0ce" stroke="none"/><text x="700" y="145" font-size="25" font-weight="700" fill="#183044">6行PC</text><text x="700" y="177" font-size="18" font-weight="400" fill="#183044">15块 → 棋盘清空</text><text x="35" y="230" font-size="21" font-weight="700" fill="#183044">累计：10 → 20 → 35块；35 = 5 × 7，回到七袋相位</text><text x="30" y="292" font-size="24" font-weight="700" fill="#183044">4444444：七次四行PC</text><rect x="35" y="312" width="115" height="74" rx="8" fill="#e3eafd" stroke="none"/><text x="54" y="343" font-size="19" font-weight="700" fill="#183044">4行PC</text><text x="62" y="370" font-size="17" font-weight="400" fill="#183044">10块</text><text x="152" y="355" font-size="19" font-weight="700" fill="#183044">→</text><rect x="171" y="312" width="115" height="74" rx="8" fill="#e3eafd" stroke="none"/><text x="190" y="343" font-size="19" font-weight="700" fill="#183044">4行PC</text><text x="198" y="370" font-size="17" font-weight="400" fill="#183044">10块</text><text x="288" y="355" font-size="19" font-weight="700" fill="#183044">→</text><rect x="307" y="312" width="115" height="74" rx="8" fill="#e3eafd" stroke="none"/><text x="326" y="343" font-size="19" font-weight="700" fill="#183044">4行PC</text><text x="334" y="370" font-size="17" font-weight="400" fill="#183044">10块</text><text x="424" y="355" font-size="19" font-weight="700" fill="#183044">→</text><rect x="443" y="312" width="115" height="74" rx="8" fill="#e3eafd" stroke="none"/><text x="462" y="343" font-size="19" font-weight="700" fill="#183044">4行PC</text><text x="470" y="370" font-size="17" font-weight="400" fill="#183044">10块</text><text x="560" y="355" font-size="19" font-weight="700" fill="#183044">→</text><rect x="579" y="312" width="115" height="74" rx="8" fill="#e3eafd" stroke="none"/><text x="598" y="343" font-size="19" font-weight="700" fill="#183044">4行PC</text><text x="606" y="370" font-size="17" font-weight="400" fill="#183044">10块</text><text x="696" y="355" font-size="19" font-weight="700" fill="#183044">→</text><rect x="715" y="312" width="115" height="74" rx="8" fill="#e3eafd" stroke="none"/><text x="734" y="343" font-size="19" font-weight="700" fill="#183044">4行PC</text><text x="742" y="370" font-size="17" font-weight="400" fill="#183044">10块</text><text x="832" y="355" font-size="19" font-weight="700" fill="#183044">→</text><rect x="851" y="312" width="115" height="74" rx="8" fill="#e3eafd" stroke="none"/><text x="870" y="343" font-size="19" font-weight="700" fill="#183044">4行PC</text><text x="878" y="370" font-size="17" font-weight="400" fill="#183044">10块</text><text x="35" y="423" font-size="21" font-weight="700" fill="#183044">累计：10 → 20 → 30 → 40 → 50 → 60 → 70块</text><text x="35" y="458" font-size="20" font-weight="400" fill="#183044">70 = 10 × 7。六次只有60块；第七次才完成这一轮对齐。<